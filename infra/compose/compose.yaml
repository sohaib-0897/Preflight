name: preflight
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: preflight
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight"]
      interval: 5s
      retries: 20
    networks: [backend]
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [backend]
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      DATABASE_URL: postgresql+psycopg://preflight:${POSTGRES_PASSWORD}@postgres/preflight
      REDIS_URL: redis://redis:6379/0
      PREFLIGHT_EXECUTION: trusted-demo
      PREFLIGHT_COOKIE_SECURE: "false"
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes: ["artifacts:/app/.local"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, ingress]
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["arq", "preflight.arq_worker.WorkerSettings"]
    stop_grace_period: 140s
    environment:
      DATABASE_URL: postgresql+psycopg://preflight:${POSTGRES_PASSWORD}@postgres/preflight
      REDIS_URL: redis://redis:6379/0
      PREFLIGHT_EXECUTION: trusted-demo
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes: ["artifacts:/app/.local"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
volumes:
  postgres:
  redis:
  artifacts:
networks:
  backend:
    internal: true
  ingress:
    # Trusted API ingress only; workers and data services remain internal.
    driver: bridge
