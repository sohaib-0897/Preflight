name: preflight
services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        PREFLIGHT_API_ORIGIN: http://api:8000
    ports: ["127.0.0.1:${PREFLIGHT_WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777", "/app/.next/cache:rw,nosuid,nodev,noexec,size=32m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [ingress]
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: preflight
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks: [backend]
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    networks: [backend]
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports: ["127.0.0.1:${PREFLIGHT_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      DATABASE_URL: postgresql+psycopg://preflight:${POSTGRES_PASSWORD}@postgres/preflight
      REDIS_URL: redis://redis:6379/0
      PREFLIGHT_EXECUTION: trusted-demo
      PREFLIGHT_COOKIE_SECURE: ${PREFLIGHT_COOKIE_SECURE:-false}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes: ["artifacts:/app/.local"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, ingress]
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["arq", "preflight.arq_worker.WorkerSettings"]
    stop_grace_period: 140s
    healthcheck:
      test: ["CMD", "arq", "--check", "preflight.arq_worker.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+psycopg://preflight:${POSTGRES_PASSWORD}@postgres/preflight
      REDIS_URL: redis://redis:6379/0
      PREFLIGHT_EXECUTION: trusted-demo
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes: ["artifacts:/app/.local"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
volumes:
  postgres:
  redis:
  artifacts:
networks:
  backend:
    internal: true
  ingress:
    # Trusted API ingress only; workers and data services remain internal.
    driver: bridge
