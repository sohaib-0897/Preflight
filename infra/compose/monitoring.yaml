services:
  api:
    environment:
      PREFLIGHT_METRICS_TOKEN: ${PREFLIGHT_METRICS_TOKEN:?Set a private monitoring token}
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    secrets: [metrics_token]
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports: ["127.0.0.1:3001:3000"]
    networks: [backend]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set a local Grafana password}

secrets:
  metrics_token:
    environment: PREFLIGHT_METRICS_TOKEN
