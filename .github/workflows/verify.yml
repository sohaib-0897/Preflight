name: Verify Preflight
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.5-alpine
        ports: ['16379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - name: Static analysis and source hygiene
        run: |
          pip install ruff==0.12.12 mypy==1.18.1
          ruff check apps packages scripts tests examples
          ruff format --check apps packages scripts tests examples
          mypy --ignore-missing-imports --follow-imports=skip packages/python-sdk/preflight_sdk packages/agent-adapters/preflight_adapters packages/scoring/preflight_scoring/metrics.py packages/security/preflight_security/dependencies.py apps/api/preflight/telemetry.py
          python scripts/hygiene.py
          pip check
      - name: Verify installed SDK wheel
        run: |
          pip wheel --no-deps --wheel-dir .local/sdk-dist packages/python-sdk
          pip install --no-deps .local/sdk-dist/preflight_agent_sdk-0.2.0-py3-none-any.whl
          python -I scripts/verify_sdk.py
      - name: Build restricted native sandbox (repository root context)
        run: |
          docker info
          docker build -f infra/docker/sandbox.Dockerfile -t preflight-sandbox:0.1.0 .
      - run: PYTHONPATH=tests python -m pytest -q
      - name: Verify actual Redis job execution and cancellation
        run: PREFLIGHT_QUEUE_DOCKER_LIVE=1 REDIS_URL=redis://127.0.0.1:16379/0 python scripts/verify_queue.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify complete Compose stack, migrations and browser worker journey
        run: PREFLIGHT_COMPOSE_BROWSER=1 python scripts/verify_compose.py
      - run: python scripts/demo.py --mode accurate --output .local/ci-report.json
      - name: Verify a regression blocks release
        shell: bash
        run: |
          set +e
          python scripts/demo.py --mode regressed --output .local/regression-report.json
          result=$?
          set -e
          test "$result" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          include-hidden-files: true
          path: |
            .local/*report.json
            test-results/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck && npm run build:offline && npm run test:web
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - run: npm ci --prefix apps/web
      - run: PREFLIGHT_API_ORIGIN=http://127.0.0.1:18000 NEXT_TELEMETRY_DISABLED=1 npm --prefix apps/web run build
      - run: npm --prefix apps/web test
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test -c playwright.next.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: next-browser-evidence, path: 'test-results/'}
  frameworks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [langgraph, crewai, openai-agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.0
      - run: uv venv .framework --python 3.12
      - run: uv pip sync --python .framework/bin/python requirements/agents/${{ matrix.framework }}.lock
      - run: .framework/bin/python scripts/framework_smoke.py ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-${{ matrix.framework }}-evidence
          include-hidden-files: true
          path: .local/*-smoke.json
  official-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: [tau3, agentdojo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.0 -r requirements.lock
      - run: bash scripts/install_benchmark.sh ${{ matrix.benchmark }}
      - name: Execute genuine official scorer with offline reference agent
        run: |
          if [ "${{ matrix.benchmark }}" = tau3 ]; then runtime=.local/tau-venv/bin/python; else runtime=.local/agentdojo-venv/bin/python; fi
          "$runtime" scripts/verify_official.py ${{ matrix.benchmark }}
      - name: Verify official API and worker persistence
        run: python scripts/verify_official_platform.py ${{ matrix.benchmark }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-${{ matrix.benchmark }}-smoke
          include-hidden-files: true
          path: .local/*-official-smoke.json
