name: Verify Preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: PYTHONPATH=tests python -m pytest -q
      - run: python scripts/demo.py --mode accurate --output .local/ci-report.json
      - name: Verify a regression blocks release
        shell: bash
        run: |
          set +e
          python scripts/demo.py --mode regressed --output .local/regression-report.json
          result=$?
          set -e
          test "$result" = 1
      - uses: actions/upload-artifact@v4
        with: {name: native-evidence, path: '.local/*report.json'}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck && npm run build:offline && npm run test:web
