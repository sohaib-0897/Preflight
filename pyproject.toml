[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-platform"
version = "0.1.0"
description = "Evidence-based agent evaluation for self-hosted teams"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.142.2", "pydantic==2.13.5", "sqlalchemy==2.1.4", "uvicorn==0.54.0", "argon2-cffi==25.1.0", "alembic==1.20.0", "httpx==0.28.1", "psycopg[binary]==3.3.6", "cryptography==50.0.2", "opentelemetry-sdk==1.45.1", "fpdf2==2.8.9"]

[project.optional-dependencies]
queue = ["arq==0.28.0", "redis==5.3.1"]
async = ["aiosqlite==0.22.1", "greenlet==3.5.6"]
observability = ["opentelemetry-sdk==1.45.1"]
dev = ["pypdf==6.20.0", "pytest==9.1.1", "ruff==0.12.12", "mypy==1.18.1"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/evaluation-core", "packages/agent-adapters", "packages/scoring", "packages/security", "packages/python-sdk", "packages/benchmark-adapters"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
