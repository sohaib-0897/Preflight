[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "preflight-agent-sdk"
version = "0.1.0"
requires-python = ">=3.12"
description = "Preflight cookie-session API client"
license = "MIT"
[tool.setuptools.packages.find]
where = ["."]
include = ["preflight_sdk*"]
