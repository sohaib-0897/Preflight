[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "preflight-agent-sdk"
version = "0.2.0"
description = "Agent connections and evaluation client for self-hosted Preflight"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["preflight_sdk*"]
